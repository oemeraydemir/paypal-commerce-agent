name: CI

# Produces the authoritative, environment-clean evidence that the S11 test
# suite passes end to end (expected: 143/143), including the two
# environment.test.ts cases that spawn a real child Node process — which the
# restricted agent sandbox used during validation cannot do (spawnSync EBUSY).
#
# These tests must run where child-process spawning works: a normal CI runner
# or a developer machine. This workflow is that place.

on:
  push:
    branches: [main, 'fix/**', 'feature/**', 'sprint/**']
  pull_request:
  workflow_dispatch:

defaults:
  run:
    working-directory: apps/backend

jobs:
  backend:
    name: Backend — typecheck + tests + build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check (tsc --noEmit)
        run: npx tsc --noEmit -p tsconfig.json

      - name: Unit + integration tests (expect 143/143)
        run: npm test

      - name: Production build
        run: npm run build

      - name: Verify build artifacts (entry + dashboard)
        run: |
          test -f dist/src/server.js || (echo "MISSING dist/src/server.js" && exit 1)
          test -f dist/public/dashboard.html || (echo "MISSING dist/public/dashboard.html" && exit 1)
          echo "Build artifacts OK"

  flutter:
    name: Flutter — analyze + test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: apps/flutter_app
        run: flutter pub get

      - name: Analyze
        working-directory: apps/flutter_app
        run: flutter analyze

      - name: Test
        working-directory: apps/flutter_app
        run: flutter test
