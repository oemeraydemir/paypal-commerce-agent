name: flutter_app
description: "PayPal Commerce Agent - Flutter thin client (chat + cart + PayPal checkout)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
  # Bundled Material/Cupertino/Widgets localization delegates. Required so the
  # declared supported locales (en_IE, tr_TR) resolve to real framework
  # localizations; without this, a Turkish locale throws
  # "No MaterialLocalizations found".
  flutter_localizations:
    sdk: flutter
  # Networking to the commerce-agent backend.
  http: ^1.1.0
  # Open the PayPal approval URL in the system browser.
  url_launcher: ^6.2.2
  # Reactivity: ChatProvider / CheckoutProvider wired with ChangeNotifierProxyProvider.
  provider: ^6.1.1
  # Timestamp formatting for chat bubbles. Pinned to the version required by
  # flutter_localizations (see above).
  intl: ^0.20.3
  cupertino_icons: ^1.0.8
  app_links: ^7.2.2
  shared_preferences: ^2.5.6
  # Secure storage for the session identity (see lib/services/secure_session_storage.dart).
  # The rest of the app depends only on the abstract SessionStorage, so this is the
  # single concrete production implementation.
  flutter_secure_storage: ^9.0.0
  # Voice shopping: on-device speech-to-text (Android SpeechRecognizer / iOS
  # SFSpeechRecognizer). No cloud API key or subscription is required; availability
  # is checked at runtime so the mic is only shown where it actually works.
  speech_to_text: ^7.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Direct dependency so the pure-Dart voice-controller unit test can be run
  # (and is resolvable by the analyzer) without pulling in the Flutter runtime.
  test: ^1.24.0

flutter:
  uses-material-design: true
