<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>AI Café · Verify signed Cart Mandate</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%98%95%3C/text%3E%3C/svg%3E">
<style>
:root{--bg:#f7f3ee;--card:#fff;--ink:#241b14;--mut:#7a6c5f;--line:#e6ddd2;--ok:#1f7a45;--bad:#b3261e}
@media(prefers-color-scheme:dark){:root{--bg:#17120e;--card:#221b15;--ink:#f3ebe2;--mut:#a89888;--line:#3a2f26;--ok:#5fd18d;--bad:#ff8a80}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:520px;margin:24px auto;padding:0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
h1{margin:0 0 4px;font-size:20px}.mut{color:var(--mut)}
.verdict{font-size:18px;font-weight:700;margin:12px 0}.ok{color:var(--ok)}.bad{color:var(--bad)}
ul{padding-left:0;list-style:none;margin:8px 0}li{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px solid var(--line)}
.row{margin:4px 0;font-size:14px}a{color:#0070ba}
</style>
</head>
<body>
<main>
  <div class="card">
    <h1>☕ AI Café</h1>
    <div class="mut" id="sub">Signed Cart Mandate check</div>
    <div id="out" aria-live="polite">Checking…</div>
  </div>
</main>
<script src="/verify.js"></script>
</body>
</html>
