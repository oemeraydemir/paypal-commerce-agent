<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Split bill · AI Café</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%98%95%3C/text%3E%3C/svg%3E">
<style>
:root{--bg:#f7f3ee;--card:#fff;--ink:#241b14;--mut:#7a6c5f;--line:#e6ddd2;--brand:#0070ba;--brand-ink:#fff;--ok:#1f7a45;--warn:#a65b00;--bad:#b3261e;--r:14px}
@media(prefers-color-scheme:dark){:root{--bg:#17120e;--card:#221b15;--ink:#f3ebe2;--mut:#a89888;--line:#3a2f26;--ok:#5fd18d;--warn:#f0b05a;--bad:#ff8a80}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding:14px 20px;border-bottom:1px solid var(--line);background:var(--card)}
header h1{margin:0;font-size:20px;flex:1}
a{color:var(--brand)}
.lang{display:flex;align-items:center;gap:6px;color:var(--mut);font-size:13px}
select,button{font:inherit;color:inherit}
select{padding:5px 8px;border-radius:10px;border:1px solid var(--line);background:var(--bg)}
button{cursor:pointer;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 14px}
button.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink);font-weight:600}
button.danger{color:var(--bad);border-color:var(--bad)}
button:disabled{opacity:.5;cursor:not-allowed}
button.loading{opacity:.7;cursor:progress}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
main{max-width:640px;margin:16px auto;padding:0 16px;display:flex;flex-direction:column;gap:14px}
section{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
h2{margin:0 0 10px;font-size:16px}
.mut{color:var(--mut)}
.msg{padding:12px 14px;border-radius:var(--r);border:1px solid var(--line);background:var(--card)}
.msg.ok{border-color:var(--ok)}.msg.bad{border-color:var(--bad)}.msg.warn{border-color:var(--warn)}
.big{font-size:26px;font-weight:700}
.kv{display:flex;justify-content:space-between;gap:12px;padding:3px 0}
.meter{height:10px;border-radius:99px;background:var(--bg);border:1px solid var(--line);overflow:hidden;margin:10px 0 4px}
.meter div{height:100%;background:var(--ok);transition:width .3s}
.share{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.share:last-child{border-bottom:0}
.share .who{font-weight:600}
.share .amt{font-weight:700;white-space:nowrap}
.chip{display:inline-block;font-size:12px;padding:2px 9px;border-radius:99px;border:1px solid var(--line);color:var(--mut)}
.chip.joined{color:var(--warn);border-color:var(--warn)}.chip.paid{color:var(--ok);border-color:var(--ok)}.chip.failed{color:var(--bad);border-color:var(--bad)}.chip.started{color:var(--brand);border-color:var(--brand)}
.share.mine{background:rgba(0,112,186,.06);margin:0 -8px;padding:10px 8px;border-radius:10px}
.invite{border:1px dashed var(--line);border-radius:12px;padding:12px;margin:10px 0;text-align:center}
.invite img{background:#fff;border-radius:8px;max-width:100%;height:auto;image-rendering:pixelated}
.invite .row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:8px}
.full{width:100%}
.items{list-style:none;margin:0;padding:0}.items li{display:flex;justify-content:space-between;gap:10px;padding:3px 0}
.success{text-align:center;padding:6px 0}.success .tick{font-size:34px}
</style>
</head>
<body>
<header>
  <h1>☕ <span data-i18n="room.title">Split bill</span></h1>
  <label class="lang"><span data-i18n="lang.label">Language</span>
    <select id="lang" aria-label="Language"><option value="en">English</option><option value="tr">Türkçe</option></select>
  </label>
  <a href="/" data-i18n="room.back">Back to the café</a>
</header>
<main>
  <div id="status" role="status" aria-live="polite"></div>
  <div id="room"></div>
</main>
<script src="/i18n.js" defer></script>
<script src="/qr.js" defer></script>
<script src="/split.js" defer></script>
</body>
</html>
