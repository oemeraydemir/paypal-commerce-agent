name: flutter_app
description: "PayPal Commerce Agent - Flutter thin client (chat + cart + PayPal checkout)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
  # Networking to the commerce-agent backend.
  http: ^1.1.0
  # Open the PayPal approval URL in the system browser.
  url_launcher: ^6.2.2
  # Reactivity: ChatProvider / CheckoutProvider wired with ChangeNotifierProxyProvider.
  provider: ^6.1.1
  # Timestamp formatting for chat bubbles.
  intl: ^0.18.1
  cupertino_icons: ^1.0.8
  app_links: ^7.2.2
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
