# AI Café — PayPal Commerce Agent (backend + web demo)
#
# The repository keeps all source under `source/apps/backend`. Render's `rootDir`
# MUST point there, otherwise `npm install` / `npm run build` run against an
# empty directory and the deploy fails. (Previous value `apps/backend` was wrong.)
#
# This single service serves BOTH the REST API (`/api/*`) and the static web demo
# (`/` storefront + `/dashboard` AG Grid "Agent Control Center"), so the hosted
# URL below is a complete, runnable demo judges can open immediately.
# Durable storage. Render web services have an EPHEMERAL filesystem, so orders, payment
# references, spend reservations, sessions and idempotency keys live in PostgreSQL.
# FREE-TIER CAVEAT (verified against render.com/docs/free): a Free Postgres expires 30 days
# after creation (+14 days grace, then it is deleted) and has NO backups. Use a paid
# instance type for anything beyond the hackathon, or point DATABASE_URL at another
# managed PostgreSQL (the code only needs a standard connection string).
databases:
  - name: aicafe-db
    plan: free
    databaseName: aicafe
    user: aicafe

services:
  - type: web
    name: paypal-commerce-agent-backend
    env: node
    plan: free
    rootDir: source/apps/backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: aicafe-db
          property: connectionString
      # This blueprint uses the same-region private database URL, whose managed
      # Postgres terminates TLS with a self-signed internal certificate. Keep TLS
      # on but disable peer-CA verification (standard for Render's managed DB);
      # set DATABASE_SSL_CA to verify the certificate instead.
      - key: DATABASE_SSL
        value: true
      - key: DATABASE_SSL_REJECT_UNAUTHORIZED
        value: false
      # Refuse to boot without a database instead of silently losing orders.
      # FIX-05 (R1/R2/R3): with REQUIRE_PERSISTENCE=true the service refuses to start in ANY
      # environment when DATABASE_URL is missing or the database is unreachable — it never
      # silently falls back to volatile in-memory storage.
      - key: REQUIRE_PERSISTENCE
        value: true
      # Must match the live service host. Evidence in
      # docs/archive/evidence/p3-deploy/REPORT_step4_5.md records the live host as
      # `paypal-commerce-agent.onrender.com` (without `-backend`). The storefront is
      # served same-origin, so CORS only affects an external cross-origin client.
      - key: CORS_ORIGIN
        value: https://paypal-commerce-agent.onrender.com
      - key: PAYPAL_ENABLED
        value: true
      - key: PAYPAL_ENV
        value: sandbox
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      # P10: provider-agnostic AI layer. Names only; values are entered in the
      # Render dashboard (sync:false) so no secret is ever committed.
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: CEREBRAS_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      # P13: Ops Copilot (merchant, READ-ONLY). Both must be set for the feature to
      # turn on; enter the values in the Render dashboard (sync:false) so no secret
      # is ever committed. Off = the dashboard shows "Ops Copilot is disabled".
      - key: OPS_COPILOT_ENABLED
        sync: false
      - key: OPS_COPILOT_KEY
        sync: false
      # Public https URL used inside the discovery documents (/.well-known/agent-commerce.json, agent.json,
      # llms.txt, /api/feed/products). Required in production; Render's own RENDER_EXTERNAL_URL is accepted when this
      # is unset (set it only for a custom domain). It is never derived from the Host / X-Forwarded-* headers.
      - key: PUBLIC_BASE_URL
        sync: false
      # Ed25519 key (PKCS#8 PEM) for Cart Mandates. If it is set but invalid the service refuses to start.
      # REQUIRED in production (FIX-05 / R1-R3): with it unset the service used to boot with a key
      # generated at boot, which makes every mandate issued before a restart unverifiable — the same
      # class of silent data-loss defect as a volatile database. The service now REFUSES to start in
      # production without it, so it must be set here (Render dashboard, sync:false) BEFORE the next
      # deploy. Generate with `npm run mandate:keygen`; `npm run verify:deployment` fails the release
      # gate while it is missing.
      - key: MANDATE_SIGNING_KEY
        sync: false
      # After a key rotation: the OLD key's PUBLIC key(s) only (SPKI PEM, comma separated or a JSON array, max 5),
      # so older mandates stay verifiable. Never put an old private key here.
      - key: MANDATE_PREVIOUS_PUBLIC_KEYS
        sync: false
      # Optional, not production-grade (no outbox, may lose or repeat events): POST business events to a
      # public https Zapier Catch Hook / n8n / Make URL. Private/loopback/link-local destinations are refused.
      - key: AUTOMATION_WEBHOOK_URL
        sync: false
      - key: AUTOMATION_WEBHOOK_SECRET
        sync: false
