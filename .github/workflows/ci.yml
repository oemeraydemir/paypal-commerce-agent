name: CI

# Type-checks, runs the full backend suite (unit + integration, PayPal/AI mocked)
# and builds the production bundle. The Flutter job analyzes and tests the app.
# NOTE: this file lives at the REPOSITORY ROOT (.github/) so GitHub actually runs it;
# the sources are under source/.

on:
  push:
    branches: [main, 'fix/**', 'feature/**', 'sprint/**']
  pull_request:
  workflow_dispatch:

defaults:
  run:
    working-directory: source/apps/backend

jobs:
  backend:
    name: Backend — typecheck + tests + build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: source/apps/backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check (tsc --noEmit)
        run: npx tsc --noEmit -p tsconfig.json

      - name: Unit + integration tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Verify build artifacts (entry + dashboard)
        run: |
          test -f dist/src/server.js || (echo "MISSING dist/src/server.js" && exit 1)
          test -f dist/public/dashboard.html || (echo "MISSING dist/public/dashboard.html" && exit 1)
          echo "Build artifacts OK"

  flutter:
    name: Flutter — analyze + test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: source/apps/flutter_app
        run: flutter pub get

      - name: Analyze
        working-directory: source/apps/flutter_app
        run: flutter analyze

      - name: Test
        working-directory: source/apps/flutter_app
        run: flutter test
