name: CI

# Type-checks, runs the full backend suite (unit + integration, PayPal/AI mocked)
# and builds the production bundle. The Flutter job analyzes and tests the app.
# NOTE: this file lives at the REPOSITORY ROOT (.github/) so GitHub actually runs it;
# the sources are under source/.

on:
  push:
    branches: [main, 'fix/**', 'feature/**', 'sprint/**']
  pull_request:
  workflow_dispatch:

defaults:
  run:
    working-directory: source/apps/backend

jobs:
  backend:
    name: Backend — typecheck + tests + build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: source/apps/backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check (tsc --noEmit)
        run: npx tsc --noEmit -p tsconfig.json

      - name: Unit + integration tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Verify build artifacts (entry + dashboard)
        run: |
          test -f dist/src/server.js || (echo "MISSING dist/src/server.js" && exit 1)
          test -f dist/public/dashboard.html || (echo "MISSING dist/public/dashboard.html" && exit 1)
          echo "Build artifacts OK"

  # Real-PostgreSQL atomicity smoke. This job is the ONLY place DATABASE_URL is
  # set, so the default `npm test` (pg-mem) is unaffected and the smoke suites
  # (tests/smoke) only touch a throwaway per-run schema that they create/drop
  # themselves. It exists to verify the P3 atomic DECISION guarantees that pg-mem
  # cannot model: single-winner concurrent share claims, join/nonce rollback &
  # replay protection, abandoned-CART_READY atomic recovery, active-checkout
  # protection, and "no second order for the same share". The PayPal smoke still
  # skips (no sandbox creds in CI); that is expected and reported, not a failure.
  #
  # NOTE: this is a temporary verification gate for the P3 closure. Keep it until
  # the real-PG results are green, then it may be removed or promoted to required.
  smoke-real-pg:
    name: Backend — real PostgreSQL atomicity smoke
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aicafe_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/aicafe_test
      # Fail the job if any real-PG suite is skipped (e.g. the service was not
      # reachable or DATABASE_URL did not propagate). This guarantees a green
      # check means the atomicity suites actually EXECUTED and passed — never
      # that they were merely skipped. The PayPal smoke is intentionally excluded
      # below because CI has no sandbox credentials for it.
      SMOKE_REQUIRE_REAL: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: source/apps/backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Real-PostgreSQL atomicity smoke (P3 + Pickup)
        # Scope to the real-PostgreSQL suites. pg-bills-atomicity covers the five
        # P3 closure items (concurrent claim race, join/nonce rollback+replay,
        # abandoned-CART_READY atomic recovery, active-checkout protection, no
        # second order); pg-pickup-atomicity covers the Order & Pickup Planner
        # guarantees (N+k concurrent reserves → exactly N succeed via SELECT …
        # FOR UPDATE, idempotent release, and reconciliation mapping orders.status
        # → booking status WITHOUT touching capture); pg-migrate verifies the
        # migrations apply idempotently on a real server. Each is gated solely on
        # DATABASE_URL (the route tests mock PayPal internally), so they run here
        # with no sandbox credentials. SMOKE_REQUIRE_REAL=1 makes a skipped suite
        # fail the run, so a green job proves these tests truly executed and
        # passed — never that they were merely skipped.
        run: npx jest -c jest.smoke.config.js --runInBand tests/smoke/pg-bills-atomicity.test.ts tests/smoke/pg-pickup-atomicity.test.ts tests/smoke/pg-migrate.test.ts

  flutter:
    name: Flutter — analyze + test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: source/apps/flutter_app
        run: flutter pub get

      - name: Analyze
        working-directory: source/apps/flutter_app
        run: flutter analyze

      - name: Test
        working-directory: source/apps/flutter_app
        run: flutter test
